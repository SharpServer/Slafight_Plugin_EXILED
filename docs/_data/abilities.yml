- id: sinkhole
  name: シンクホール
  category: SCP系
  summary: 向いている場所にSinkholeを作成する。
  users:
    - SCP-106
  notes:
    - Sinkholeの中心に立ったプレイヤーはポケットディメンションへ送られる。
  tags: [scp106, sinkhole]

- id: mindblaster
  name: 思壊
  category: 第五教会系
  summary: 向いている方向へ第五的な光を撃ち出し、命中した相手に火傷・脳震盪・窒息とダメージを与える。
  users:
    - SCP-3005
    - 呪詛 - セルゲイ・マカロフ（呪詛）
  notes:
    - クールダウンは5秒。
    - 第五教会陣営には当たらない。
  tags: [fifthist, missile, mindblaster]

- id: allow-escape
  name: 腐蝕からの脱出
  category: SCP系
  summary: PDExから脱出することを許可する。
  users:
    - SCP-106
  tags: [scp106, pdex]

- id: sound-of-fifth
  name: 第五からの音
  category: 第五教会系
  summary: 周囲の生物の目をくらませる。
  users:
    - 第五教会系ロール
  tags: [fifthist, blind]

- id: main-villain
  name: メインヴィラン
  category: SCP系
  summary: ランダムな部屋へテレポートする。
  users:
    - SCP-173
  notes:
    - 再使用までに時間がかかります。
  tags: [scp173, teleport]

- id: filth-operation
  name: 汚物作戦
  category: SCP系
  summary: 周囲5m以内を汚物まみれにする。
  users:
    - SCP-173
  notes:
    - 短めのクールダウンがあります。
  tags: [scp173]

- id: scp035-tentacle
  name: 触手
  category: SCP系
  summary: 向いている先にSCP-035の触手を設置する。近づいた人間を自動で攻撃し、銃撃で破壊できる。
  users:
    - SCP-035
  notes:
    - 触手はHPを持ち、CustomInfoに残りHPが表示される。
    - 射程内の非SCPを約2.5秒ごとに攻撃し、35ダメージを与える。
  tags: [scp035, tentacle]

- id: absolute-power
  name: 驚異的な力
  category: SCP系
  summary: 近くのドアを力ずくで破壊する。
  users:
    - SCP-076
  notes:
    - 3.5m以内に破壊可能なドアがないと使用できない。
    - クールダウンは120秒。
    - セルゲイ・マカロフ（呪詛）では「怨霊的な力」と表示される。
  tags: [scp076, door]

- id: generate-weapon
  name: 武器の錬成
  category: SCP系
  summary: バトルアックスか投げナイフを選んで錬成する。
  users:
    - SCP-076
  notes:
    - アビリティ切り替えキーで錬成する武器を選ぶ。
    - インベントリが満杯、または同じ武器を既に持っていると使用できない。
    - クールダウンは120秒。
    - セルゲイ・マカロフ（呪詛）では「呪具の錬成」と表示される。
  tags: [scp076, weapon]

- id: aqua-jet-jump
  name: アクアジェットジャンプ
  category: Water Warrior系
  summary: 足元へ水を噴射し、向いている方向へ高く跳ぶ。
  users:
    - WATER WARRIOR
  notes:
    - クールダウンは12秒。
  tags: [water, warrior, movement]

- id: aqua-splash
  name: アクアスプラッシュ
  category: Water Warrior系
  summary: 周囲に水しぶきを撒き散らし、半径6m以内の敵を吹き飛ばす。
  users:
    - WATER WARRIOR
  notes:
    - 吹き飛ばされた相手は8秒間SinkHoleへ引きずり込まれる。
    - 同じ陣営のプレイヤーには当たらない。
    - クールダウンは25秒。
  tags: [water, warrior, knockback]

- id: old-man-road
  name: 爺街道
  category: 季節 / ネタ系
  summary: 8個の汚物を一定間隔で落とし、汚物の道を生成する。
  users:
    - SCP-106 (April Fools)
  notes:
    - 代わりにSinkholeが無効化される。
  tags: [april, scp106]
